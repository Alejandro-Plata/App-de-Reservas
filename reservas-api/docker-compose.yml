services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: reservas
      POSTGRES_USER: reservas
      POSTGRES_PASSWORD: reservas
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U reservas -d reservas"]
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_URL: jdbc:postgresql://db:5432/reservas
      DB_USER: reservas
      DB_PASSWORD: reservas
      JWT_SECRET: ${JWT_SECRET:-secreto-solo-para-desarrollo-local-0123456789}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@reservas.local}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-admin-local-1234}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:4200,http://127.0.0.1:4200}
    ports:
      - "8080:8080"

volumes:
  pgdata:
