<section class="hero-panel chamfer">
  <h1 class="display">Press Start</h1>
  <p class="tagline">Inicia sesión para reservar tu recurso.</p>
</section>

<div class="form-panel">
  <div class="section-label-bar">Log in</div>
  <form [formGroup]="loginForm" (ngSubmit)="onSubmit()" class="module-body" novalidate>

    <div class="field">
      <label for="email">E-mail</label>
      <input id="email" type="email" formControlName="email" autocomplete="email"
        [class.invalid]="isFieldInvalid('email')">
      @if (isFieldInvalid('email')) {
      <span class="error-msg">Introduce un e-mail válido.</span>
      }
    </div>

    <div class="field">
      <label for="password">Contraseña</label>
      <input id="password" type="password" formControlName="password" autocomplete="current-password"
        [class.invalid]="isFieldInvalid('password')">
      @if (isFieldInvalid('password')) {
      <span class="error-msg">La contraseña es obligatoria.</span>
      }
    </div>

    @if (errorMessage) {
    <div class="error-alert" role="alert">{{ errorMessage }}</div>
    }

    <button type="submit" class="btn btn-submit" [disabled]="isLoading">
      {{ isLoading ? 'Cargando…' : 'Entrar' }} <span class="arrow-disc">›</span>
    </button>

    <hr class="dotted-divider">
    <p>¿Aún no tienes cuenta? <a routerLink="/register">Regístrate aquí</a></p>
  </form>
</div>
